# Use: docker compose -p telegram_ai_pm_v2 --env-file .env.v2 -f docker-compose.yml -f compose.v2.yml ...
# !override requires Docker Compose >= 2.24.4.
services:
  db:
    environment:
      POSTGRES_DB: telegram_ai_pm_v2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d telegram_ai_pm_v2"]
  bot:
    env_file: !override
      - .env.v2
  backup:
    environment:
      PGDATABASE: telegram_ai_pm_v2
