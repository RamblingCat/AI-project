services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pm
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 5s
      retries: 10
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
    init: true
    stop_grace_period: 30s
  backup:
    image: postgres:16
    user: postgres
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: pm
      PGDATABASE: pm
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      KEEP_DAYS: "7"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/backup-loop.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - backups:/var/lib/postgresql/data
volumes:
  pgdata:
  backups:
